<script>
var D=[
{n:"Пн · Верх A (дома)",e:[["Жим штанги лёжа",4,"5-8"],["Тяга гантелей, грудью на наклонную скамью",4,"8-10"],["Жим гантелей на наклонной (30°)",3,"8-10"],["Тяга гантели одной рукой с упором",3,"8-10"],["Пуллавер с гантелью",2,"12"],["Бицепс со штангой сидя, спина на опоре",2,"8-10"],["Французский жим лёжа",2,"8-10"]]},
{n:"Ср · Низ A (дома)",e:[["Ягодичный мост со штангой",4,"8-12"],["Мост на одной ноге",3,"10-12"],["Сгибание ноги с гантелью лёжа",3,"10-15"],["Подъём на носки сидя с гантелью",4,"12-15"],["Мёртвый жук / планка",3,"30-45",1]]},
{n:"Пт · Верх B (дома)",e:[["Жим гантелей на наклонной (45°, нейтр. хват)",3,"8-12"],["Тяга гантелей с упором грудью",3,"10-12"],["Жим гантелей лёжа",3,"8-12"],["Махи гантелями в стороны",4,"12-20"],["Задние дельты с упором грудью",3,"12-15"],["Сгибания на бицепс на наклонной скамье",3,"10-12"],["Разгибание гантели из-за головы лёжа",3,"10-12"],["Молотки сидя",2,"10-12"]]},
{n:"Сб · Низ B + блоки (зал)",e:[["Жим ногами",4,"8-12"],["Сгибание ног лёжа",3,"10-12"],["Разгибание ног",3,"12-15"],["Тяга верхнего блока",3,"8-12"],["Тяга сидя на блоке, упор грудью",3,"8-12"],["Сведение рук в кроссовере",2,"12-15"],["Face pull",2,"15"]]}];
var NOTE=["Вводная: подберите рабочие веса, запас 2-3 повтора.","Те же веса, стремитесь к верху диапазона.","Если везде верх диапазона, добавьте вес.","Удерживайте веса недели 3 или +1 повтор.","РАЗГРУЗКА: на 1 подход меньше, веса −10%."];
var auto=0,w=0,d=0,tab="plan",ed=false,data={},db=null,ref=null,timer=null,LS="cut5",viewing=null,stash=null;
D.forEach(function(x,di){x.e.forEach(function(ex,ei){ex[3]=ex[3]||0;ex[4]="d"+di+"_e"+ei})});
var D0=JSON.stringify(D);
function $(i){return document.getElementById(i)}
function h(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function nsets(wk,ex){var o=data["w"+wk+"_"+ex[4]+"_n"];if(o!=null&&o!=="")return +o;var b=+ex[1]||1;return wk==4?Math.max(Math.min(2,b),b-1):b}
function key(a,id,s,f){return "w"+a+"_"+id+"_s"+s+"_"+f}
function setSt(t){$("st").textContent=t}
function flush(){clearTimeout(timer);timer=null;if(ref){ref.set(data).then(function(){setSt("сохранено в аккаунте ✓")},function(){setSt("ошибка синхронизации")})}else{setSt("сохранено только на этом устройстве")}}
function save(){if(viewing!=null)return;try{localStorage.setItem(LS,JSON.stringify(data))}catch(e){}setSt("сохраняю…");clearTimeout(timer);timer=setTimeout(flush,600)}
document.addEventListener("visibilitychange",function(){if(document.hidden&&timer)flush()});
window.addEventListener("pagehide",function(){if(timer)flush()});
function savePlan(){data["plan"+w]=JSON.stringify(D);save()}
function planFor(wk){for(var i=wk;i>=0;i--){var p=data["plan"+i];if(p){try{var x=JSON.parse(p);if(x&&x.length)return x}catch(e){}}}
 if(data.plan){try{var y=JSON.parse(data.plan);if(y&&y.length)return y}catch(e){}}return JSON.parse(D0)}
function tabs(){
 var t="";for(var i=0;i<5;i++)t+='<button data-w="'+i+'" class="'+(i==w&&tab=="plan"?"on":"")+'">Нед '+(i+1)+'</button>';
 t+='<button data-t="prog" class="'+(tab=="prog"?"on":"")+'">📈</button>';$("wk").innerHTML=t;
 var g="";if(tab=="plan"){D.forEach(function(x,i){g+='<button data-d="'+i+'" class="'+(i==d?"on":"")+'">'+h(x.n.split(/[ ·]/)[0]||"День")+'</button>'});
  if(ed)g+='<button data-a="ad">＋</button>'}
 $("dy").innerHTML=g;
}
function best(a,ex){
 var bk=-1,br=0,tm=ex[3];
 for(var s=0;s<15;s++){var k=parseFloat((data[key(a,ex[4],s,"k")]||"").replace(",",".")),r=parseFloat(data[key(a,ex[4],s,"r")]);
  if(tm){if(r>br){br=r;bk=0}}else if(!isNaN(k)&&!isNaN(r)&&(k>bk||(k==bk&&r>br))){bk=k;br=r}}
 if(bk<0)return "";return tm?br+" сек":bk+"×"+br;
}
var GR=["Грудь","Спина","Плечи","Бицепс","Трицепс","Квадрицепс","Бицепс бедра","Ягодицы","Икры","Пресс","Другое","Суперсет"];
function guess(n){n=String(n||"").toLowerCase();
 if(/жим ногами|разгибание ног|присед|выпад/.test(n))return "Квадрицепс";
 if(/сгибание ног|сгибание ноги|румын|гиперэкст/.test(n))return "Бицепс бедра";
 if(/мост|ягодич/.test(n))return "Ягодицы";
 if(/носк|икр/.test(n))return "Икры";
 if(/планк|мёртвый жук|мертвый жук|пресс|скручив/.test(n))return "Пресс";
 if(/задние дельт|face pull|тяга лица|махи|плеч|дельт|арнольд|жим гантелей сидя|над головой/.test(n))return "Плечи";
 if(/бицепс|молотк/.test(n))return "Бицепс";
 if(/трицепс|французск|разгибание гантели|разгибание рук|брусь/.test(n))return "Трицепс";
 if(/тяга|подтягив|пуллавер|шраг/.test(n))return "Спина";
 if(/жим|грудь|разводк|сведение|отжим|кроссовер/.test(n))return "Грудь";
 return "Другое"}
function gopts(ex){return GR.map(function(g){return '<option'+(g==grp(ex)?' selected':'')+'>'+g+'</option>'}).join('')}
function grp(ex){return ex[5]||guess(ex[0])}
function isSS(ex){return ex[5]=="Суперсет"}
function gA(ex){return ex[6]||guess(ex[0])}
function gB(ex){return ex[8]||guess(ex[7])}
function gopts2(sel){return GR.filter(function(g){return g!="Суперсет"}).map(function(g){return '<option'+(g==sel?' selected':'')+'>'+g+'</option>'}).join('')}
function cntSets(wk,ex,sf){var n=0;for(var s=0;s<15;s++){var k=num(data[key(wk,ex[4],s,"k"+sf)]),r=num(data[key(wk,ex[4],s,"r"+sf)]);if(ex[3]&&!sf?r>0:(!isNaN(k)&&!isNaN(r)&&r>0))n++}return n}
function ssHead(ex,i){if(!isSS(ex))return "";return '<div class="ctl" style="margin:0 0 6px"><span class="rg">А:</span><select class="gs" data-p="ga" data-i="'+i+'">'+gopts2(gA(ex))+'</select></div><div class="ctl" style="margin:0 0 6px;flex-wrap:nowrap"><span class="rg">Б:</span><input class="nm" data-p="n2" data-i="'+i+'" value="'+h(ex[7])+'" placeholder="Второе упражнение"><select class="gs" data-p="gb" data-i="'+i+'">'+gopts2(gB(ex))+'</select></div>'}
function grpSets(wk,exs){var m={};exs.forEach(function(ex){if(isSS(ex)){var a=cntSets(wk,ex,""),b=cntSets(wk,ex,"2");if(a)m[gA(ex)]=(m[gA(ex)]||0)+a;if(b)m[gB(ex)]=(m[gB(ex)]||0)+b}else{var n=exVol(wk,ex).sets;if(n){var g=grp(ex);m[g]=(m[g]||0)+n}}});return m}
function grpPlan(wk,exs){var m={};exs.forEach(function(ex){var n=nsets(wk,ex);if(isSS(ex)){m[gA(ex)]=(m[gA(ex)]||0)+n;m[gB(ex)]=(m[gB(ex)]||0)+n}else{var g=grp(ex);m[g]=(m[g]||0)+n}});return m}
function wkPlan(wk){var m={};planFor(wk).forEach(function(day){var x=grpPlan(wk,day.e);for(var g in x)m[g]=(m[g]||0)+x[g]});return m}
function grpLines(day){var m=grpSets(w,day.e),p=w>0?grpSets(w-1,day.e):{},o="",q=grpPlan(w,day.e);
 GR.forEach(function(g){if(m[g]||q[g])o+="<br>"+g+": <b>"+(m[g]||0)+"</b> из "+(q[g]||0)+(w>0&&p[g]?" (прошлая нед.: "+p[g]+")":"")});
 return o?"<br><b>Подходов по группам (сделано из плана):</b>"+o:""}
function grpTable(P){var T={};for(var i=0;i<5;i++)P[i].forEach(function(day){var m=grpSets(i,day.e);for(var g in m){T[g]=T[g]||[0,0,0,0,0];T[g][i]+=m[g]}});
 var o='<div class="note">Подходов по группам мышц за неделю</div><div class="card sc"><table><tr><th></th>';for(var i=1;i<=5;i++)o+='<th>Н'+i+'</th>';o+='</tr>';var any=0;
 GR.forEach(function(g){if(!T[g])return;any=1;o+='<tr><td>'+g+'</td>';for(var i=0;i<5;i++)o+='<td>'+(T[g][i]||"–")+'</td>';o+='</tr>'});
 return any?o+'</table></div>':'<div class="note">Подходов по группам: пока нет данных.</div>'}
function weekGrp(i){var T={};planFor(i).forEach(function(day){var m=grpSets(i,day.e);for(var g in m)T[g]=(T[g]||0)+m[g]});
 var a=[];GR.forEach(function(g){if(T[g])a.push(g+" "+T[g])});return a.join(", ")}
function wkG(wk){var T={};planFor(wk).forEach(function(day){var m=grpSets(wk,day.e);for(var g in m)T[g]=(T[g]||0)+m[g]});return T}
function wkS(wk){var t={v:0,sets:0};planFor(wk).forEach(function(day){var x=dayStat(wk,day.e);t.v+=x.v;t.sets+=x.sets});return t}
function wkHtml(){var c=wkS(w);if(!c.sets)return "<b>Итого за неделю "+(w+1)+"</b><div class=\"note\">Появится, когда вы внесёте подходы.</div>";
 var p=w>0?wkS(w-1):null,m=wkG(w),pm=w>0?wkG(w-1):{},q=wkPlan(w),o="<b>Итого за неделю "+(w+1)+"</b><br>Тоннаж: <b>"+fmt(c.v)+" кг</b>"+(p&&p.v>0?pc(c.v,p.v)+" к прошлой неделе":"")+"<br>Подходов: "+c.sets+"<br><b>Подходов по группам:</b>";
 GR.forEach(function(g){if(m[g]||q[g])o+="<br>"+g+": <b>"+(m[g]||0)+"</b> из "+(q[g]||0)+(w>0&&pm[g]?" (прошлая нед.: "+pm[g]+")":"")});return o}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g," ")}
function pc(a,b){if(!b)return "";var p=(a-b)/b*100;return " ("+(p>0?"+":"")+p.toFixed(1).replace(".",",")+"%)"}
function num(x){return parseFloat(String(x==null?"":x).replace(",","."))}
function exVol(wk,ex){var v=0,n=0,r0=0,sec=0;for(var s=0;s<15;s++){var k=num(data[key(wk,ex[4],s,"k")]),r=num(data[key(wk,ex[4],s,"r")]);
 if(ex[3]){if(!isNaN(r)&&r>0){sec+=r;n++}}else if(!isNaN(k)&&!isNaN(r)&&r>0){v+=k*r;n++;r0+=r}
 if(isSS(ex)){var k2=num(data[key(wk,ex[4],s,"k2")]),r2=num(data[key(wk,ex[4],s,"r2")]);if(!isNaN(k2)&&!isNaN(r2)&&r2>0){v+=k2*r2;n++;r0+=r2}}}
 return {v:v,sets:n,reps:r0,sec:sec}}
function dayStat(wk,exs){var t={v:0,sets:0,reps:0};exs.forEach(function(ex){var x=exVol(wk,ex);t.v+=x.v;t.sets+=x.sets;t.reps+=x.reps});return t}
function tnText(ex){var x=exVol(w,ex);if(!x.sets)return "Тоннаж: –";if(ex[3])return "Всего: "+x.sec+" сек · "+x.sets+" подх.";
 var p=w>0?exVol(w-1,ex).v:0;return "Тоннаж: "+fmt(x.v)+" кг · "+x.sets+" подх."+(p>0?" · прошлая нед. "+fmt(p)+pc(x.v,p):"")}
function sumHtml(day){var c=dayStat(w,day.e);if(!c.sets)return "<b>Итого за тренировку</b><div class=\"note\">Внесите подходы, и здесь появится тоннаж.</div>";
 var p=w>0?dayStat(w-1,day.e):null;
 return "<b>Итого за тренировку</b><br>Тоннаж: <b>"+fmt(c.v)+" кг</b>"+(p&&p.v>0?pc(c.v,p.v)+" к прошлой неделе ("+fmt(p.v)+")":"")+"<br>Подходов: "+c.sets+" · повторов: "+c.reps+(c.reps?" · средний вес на повтор: "+(c.v/c.reps).toFixed(1).replace(".",",")+" кг":"")+grpLines(day)}
function upd(){if(tab!="plan"||ed)return;var day=D[d];day.e.forEach(function(ex,ei){var el=$("tn"+ei);if(el)el.innerHTML=tnText(ex)});var s=$("sum");if(s)s.innerHTML=sumHtml(day);var ws=$("wsum");if(ws)ws.innerHTML=wkHtml()}
function volTable(P){var o='<div class="note">Объём по неделям (тоннаж, кг)</div><div class="card sc"><table><tr><th></th>';for(var i=1;i<=5;i++)o+='<th>Н'+i+'</th>';o+='</tr>';
 var md=0;P.forEach(function(p){md=Math.max(md,p.length)});var tot=[0,0,0,0,0],st=[0,0,0,0,0],wo=[0,0,0,0,0];
 for(var di=0;di<md;di++){var nm="";P.forEach(function(p){if(p[di])nm=p[di].n});o+='<tr><td>'+h(nm)+'</td>';
  for(var i=0;i<5;i++){var x=P[i][di]?dayStat(i,P[i][di].e):{v:0,sets:0};tot[i]+=x.v;st[i]+=x.sets;if(x.sets)wo[i]++;o+='<td>'+(x.sets?fmt(x.v):"–")+'</td>'}o+='</tr>'}
 o+='<tr><td><b>Всего за неделю</b></td>';for(var i=0;i<5;i++)o+='<td><b>'+(st[i]?fmt(tot[i]):"–")+'</b></td>';o+='</tr>';

  var k=num(kk),r=num(rr),t=((!ex[3]||sf)&&!isNaN(k)&&!isNaN(r))?String(Math.round(k*r*100)/100).replace(".",","):"";

   if(ss){var k2=key(w,ex[4],s,"k2"),r2=key(w,ex[4],s,"r2"),pk2=w>0?data[key(w-1,ex[4],s,"k2")]:"",pr2=w>0?data[key(w-1,ex[4],s,"r2")]:"";
